<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lịch sử Diplomacy</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        h1 { color: #2C3E50; }
        .match { background: white; padding: 20px; margin: 10px 0; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #2C3E50; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        .color-box { display: inline-block; width: 20px; height: 20px; border-radius: 4px; }
        .loading { text-align: center; padding: 50px; color: #666; }
    </style>
</head>
<body>
    <h1>📊 Lịch sử các trận đấu Diplomacy</h1>
    <div id="content"><div class="loading">Đang tải dữ liệu...</div></div>
    
    <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzRh3MX56tBVQ5NKn__t3RjnyFtY0HZaGZkq2kXmEeNE-8mzcZRA-9dh76WpAHGe0k/exec";
    
    async function loadData() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            if (!data || data.length === 0) {
                document.getElementById('content').innerHTML = 
                    '<div class="loading">📭 Chưa có dữ liệu trận đấu</div>';
                return;
            }
            
            const matches = {};
            data.forEach(row => {
                const id = row['Match ID'];
                if (!matches[id]) {
                    matches[id] = { id, time: row['Timestamp'], players: [] };
                }
                try {
                    const players = JSON.parse(row['Players Data'] || '[]');
                    if (players.length && matches[id].players.length === 0) {
                        matches[id].players = players;
                    }
                } catch(e) {}
            });
            
            let html = '';
            const colors = ['#E74C3C','#3498DB','#2ECC71','#F1C40F','#9B59B6'];
            
            Object.values(matches).reverse().forEach(match => {
                html += `
                    <div class="match">
                        <h3>${match.id}</h3>
                        <p>${match.time}</p>
                        <table>
                            <tr><th>STT</th><th>Tên</th><th>Civilization</th><th>Màu</th></tr>
                            ${match.players.map((p, i) => `
                                <tr>
                                    <td>${i+1}</td>
                                    <td>${p.name}</td>
                                    <td>${p.civilization}</td>
                                    <td><span class="color-box" style="background:${colors[i%colors.length]}"></span></td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                `;
            });
            
            document.getElementById('content').innerHTML = html;
        } catch(e) {
            document.getElementById('content').innerHTML = 
                `<div class="loading">❌ Lỗi: ${e.message}</div>`;
        }
    }
    
    loadData();
    setInterval(loadData, 30000);
    </script>
</body>
</html>
